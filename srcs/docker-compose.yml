#version: '3.8'
services:
  nginx:
    container_name: nginx-cont
    image: nginx-try:packaged
    build:
      context: ./requirements/nginx
      dockerfile: Dockerfile
    ports: 
      - "443:443"
    depends_on:
      - wordpress
    networks:
      - inception
    volumes:
      - wordpress_data:/var/www/html

  mariadb:
    container_name: mdb-cont
    image: mdb-try:packaged
    build:
      context: ./requirements/mariadb
      dockerfile: Dockerfile
    environment:
      MYSQL_ROOT_PASSWORD: cazerini
      MYSQL_DATABASE: my_database
      MYSQL_USER: test
      MYSQL_PASSWORD: pass
    healthcheck:
      test: ["CMD", "mysql", "-u", "test", "-ppass", "-e", "SELECT 1"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - inception
    volumes:
      - mariadb_data:/var/lib/mysql

  wordpress:
    container_name: wp-cont
    image: wp-try:packaged
    build:
      context: ./requirements/wordpress
      dockerfile: Dockerfile
    environment:
      DB_HOST: mariadb:3306
      DB_NAME: my_database
      DB_USER: test
      DB_PASSWORD: pass
      
      DOMAIN_NAME: cazerini.42.fr
      WP_TITLE: "Your Site Title"
      WP_ADMIN_USER: cazerini
      WP_ADMIN_PASSWORD: password
      WP_ADMIN_EMAIL: cazerini@example.com
      WP_USER: test
      WP_EMAIL: test@example.com
      WP_PASSWORD: pass
    networks:
      - inception
    depends_on:
      mariadb:
        condition: service_healthy
    volumes:
      - wordpress_data:/var/www/html

networks:
  inception:
    driver: bridge

volumes:
  wordpress_data:
  mariadb_data:
