#version: '3.8'
services:
  nginx:
    container_name: nginx-cont
    image: nginx-try:packaged
    build:
      context: ./requirements/nginx
      dockerfile: Dockerfile
    restart: always
    ports: 
      - "443:443"
    depends_on:
      - wordpress
    networks:
      - inception
    volumes:
      - wordpress_data:/var/www/html

  mariadb:
    secrets:
      - mysql_root_password
      - mysql_password
    container_name: mdb-cont
    image: mdb-try:packaged
    build:
      context: ./requirements/mariadb
      dockerfile: Dockerfile
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password 
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_password
    healthcheck:
      test: ["CMD-SHELL", "mysql", "-u", "test", "-p$(cat /run/secrets/mysql_password)", "-e", "SELECT 1"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - inception
    volumes:
      - mariadb_data:/var/lib/mysql

  wordpress:
    secrets:
      - db_password
      - wp_admin_password
      - wp_password
    container_name: wp-cont
    image: wp-try:packaged
    build:
      context: ./requirements/wordpress
      dockerfile: Dockerfile
    restart: always
    environment:
      DB_HOST: ${DB_HOST}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD_FILE: /run/secrets/db_password 

      DOMAIN_NAME: ${DOMAIN_NAME}
      WP_TITLE: ${WP_TITLE}
      WP_ADMIN_USER: ${WP_ADMIN_USER}
      WP_ADMIN_PASSWORD_FILE: /run/secrets/wp_admin_password 
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL}
      WP_USER: ${WP_USER}
      WP_EMAIL: ${WP_EMAIL}
      WP_PASSWORD_FILE: /run/secrets/wp_password 
    networks:
      - inception
    depends_on:
      mariadb:
        condition: service_healthy
    volumes:
      - wordpress_data:/var/www/html

networks:
  inception:
    driver: bridge

volumes:
  wordpress_data:
    name: wordpress_data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/cazerini/data/wordpress_data
  mariadb_data:
    name: mariadb_data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/cazerini/data/mariadb_data

secrets:
  mysql_root_password:
    file: ../secrets/mysql_root_password.txt
  mysql_password:
    file: ../secrets/mysql_password.txt
  db_password:
    file: ../secrets/db_password.txt
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt
  wp_password:
    file: ../secrets/wp_password.txt